<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power of Sequencing: Batman's Tale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>The Power of Sequencing</h1>
        <p>Same images, different narratives. Choose a sequence below to explore the story.</p>
        <div class="button-group">
            <button id="btnSequence1">Story 1: The Call to Action</button>
            <button id="btnSequence2">Story 2: The Weary Protector</button>
        </div>
    </header>

    <main>
        <section id="story-container">
            <h2 id="story-title">Select a story sequence above</h2>
            
            <div class="sequence-grid">
                <!-- Beginning -->
                <div class="card">
                    <span class="badge">Beginning</span>
                    <img id="img-beginning" src="" alt="Beginning of story">
                    <p id="desc-beginning">...</p>
                </div>

                <!-- Middle -->
                <div class="card">
                    <span class="badge">Middle</span>
                    <img id="img-middle" src="" alt="Middle of story">
                    <p id="desc-middle">...</p>
                </div>

                <!-- End -->
                <div class="card">
                    <span class="badge">End</span>
                    <img id="img-end" src="" alt="End of story">
                    <p id="desc-end">...</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>CCT360 Lab - Interactive Sequencing</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
